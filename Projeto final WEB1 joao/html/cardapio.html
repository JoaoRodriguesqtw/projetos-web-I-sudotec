  <body>
    <header>
      <section class="nome">
        <h1>Delivery kiki's coffe</h1>
        <h3>Um café temático do Studio Ghibli</h3>
        <section class="nuvem">
          <img
            src="https://i.pinimg.com/originals/e3/9d/e9/e39de96ddbf852ed53a4e9a993550641.gif"
          />
        </section>
      </section>
      <section class="links">
        <nav>
          <a href="#"
            ><button id="btnCardapio" class="botoes-nav">Cardápio</button></a
          >
          <a href="sobre.html"><button class="botoes-nav">Sobre</button></a>
          <a href="reservas.html"
            ><button class="botoes-nav">Reservas</button></a
          >
        </nav>
      </section>

    <main>
      <p id="indicador">Seção 1 de 3</p>
      <section class="kiki">

      <section class="geral">
        <section id="entradas">
          <h2>Entradas</h2>
          <p>Bruschetta: 20 R$</p>
          <p>Polenta frita: 15 R$</p>
        </section>

        <section id="pratos">
          <h2>Pratos principais</h2>
          <p>Sopa de capelletti: 44 R$</p>
          <p>Massa ao Carbonara: 64 R$</p>
          <!-- título + pelo menos 2 itens -->
        </section>

        <section id="sobremesas">
          <h2>Sobremesas</h2>
          <p>Petit gâteau: 25 R$</p>
          <p>Pudim de leite: 20 R$</p>
          <!-- título + pelo menos 2 itens -->
        </section>
      </section>

      <section class="buttons">
        <button class="botoes-nav" id="btnAnterior">Anterior</button>
        <button class="botoes-nav" id="btnTodos">Ver tudo</button>
        <button class="botoes-nav" id="btnProximo">Próximo</button>
      </section>
    </main>

    </footer>
